<!doctype html><html lang="ja"><meta charset="utf-8"><title>画面サイズ確認 | 古本フリマレジ</title><style>body{font:15px system-ui;margin:16px;background:#e4e7e3}button{padding:10px;margin-right:10px}iframe{display:block;background:#faf9f5;border:1px solid #172333;margin-top:15px}</style><h1>画面サイズ確認</h1><p>ブラウザ内で横1024×768・縦768×1024・スマートフォン幅390を確認します。iPad Safari実機検収とは別です。</p><button data-size="1024,768">iPad横</button><button data-size="768,1024">iPad縦</button><button data-size="390,844">スマートフォン</button><iframe title="レジのプレビュー" src="../" width="1024" height="768"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h;});</script></html>
